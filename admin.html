<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Choco Bliss | Order Fulfillment</title><link rel="stylesheet" href="styles.css"><style>.admin{padding:35px 7%;max-width:1200px;margin:auto}.admin h1{font-size:30px}.admin-tools{display:flex;gap:10px;flex-wrap:wrap;margin:20px 0}.admin button{padding:10px 15px;border:1px solid #b58b5b;background:#fff;cursor:pointer}.order{background:#f8f3ec;padding:20px;margin:15px 0}.order-head{display:flex;justify-content:space-between;gap:15px;flex-wrap:wrap}.order table{width:100%;border-collapse:collapse;margin-top:15px;font-size:13px}.order td,.order th{padding:9px;border-bottom:1px solid #dfd3c6;text-align:left}.status{font-size:11px;background:#e8d7c2;padding:5px 9px}.print-label{border:1px dashed #555;padding:18px;max-width:420px;margin-top:18px;background:white}.print-label h3{margin:0 0 10px}.checkline{margin-top:12px}.empty{color:#86766b;padding:30px}.admin-note{background:#fff1d9;padding:12px;font-size:12px}</style></head><body><header class="topbar"><a class="brand" href="index.html"><span class="brand-mark">C</span><span>CHOCO <b>BLISS</b><small>ORDER FULFILLMENT</small></span></a><a href="index.html">กลับหน้าร้าน</a></header><main class="admin"><p class="eyebrow">BACK OFFICE</p><h1>จัดการคำสั่งซื้อ</h1><p>ตรวจสอบออเดอร์ · หยิบสินค้า · แพ็กสินค้า · พิมพ์ใบปะหน้า</p><div class="admin-note">ต้อง Deploy Google Apps Script และตั้งค่า URL ใน config.js ก่อน ระบบจึงจะโหลดออเดอร์ได้</div><div class="admin-tools"><button id="reload">โหลดคำสั่งซื้อ</button><button onclick="window.print()">พิมพ์หน้านี้</button></div><div id="orders"><p class="empty">กด “โหลดคำสั่งซื้อ” เพื่อดึงข้อมูลจาก Google Sheets</p></div></main><script src="config.js"></script><script>
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function render(data){const list=Array.isArray(data)?data:(data.orders||[]);const root=document.getElementById("orders");if(!list.length){root.innerHTML='<p class="empty">ยังไม่มีคำสั่งซื้อ</p>';return}root.innerHTML=list.map((o,i)=>`<article class="order"><div class="order-head"><div><b>Order: ${esc(o.orderId||o.id||("ORDER-"+(i+1)))}</b><p>${esc(o.createdAt||"")}</p></div><span class="status">${esc(o.status||"รอหยิบสินค้า")}</span></div><p><b>ผู้รับ:</b> ${esc(o.customerName)} | <b>โทร:</b> ${esc(o.phone)}</p><p><b>ที่อยู่:</b> ${esc(o.address)} ${esc(o.postcode)}</p><table><thead><tr><th>SKU</th><th>สินค้า</th><th>จำนวน</th><th>ราคา</th><th>หยิบแล้ว</th></tr></thead><tbody>${(o.items||[]).map(x=>`<tr><td>${esc(x.sku)}</td><td>${esc(x.name)}</td><td>${esc(x.qty)}</td><td>฿${esc(x.unitPrice)}</td><td><input type="checkbox"></td></tr>`).join("")}</tbody></table><p><b>ยอดรวม: ฿${esc(o.total)}</b></p><label class="checkline"><input type="checkbox"> ตรวจสอบและแพ็กสินค้าเรียบร้อย</label><div class="print-label"><h3>ใบจ่าหน้าพัสดุ / SHIPPING LABEL</h3><b>ผู้รับ: ${esc(o.customerName)}</b><p>โทร. ${esc(o.phone)}</p><p>${esc(o.address)} ${esc(o.postcode)}</p><hr><small>ผู้ส่ง: CHOCO BLISS · กรุณาติดต่อผู้ส่งหากพัสดุมีปัญหา</small></div><p><button onclick="window.print()">พิมพ์ใบปะหน้า / ใบหยิบสินค้า</button></p></article>`).join("")}
document.getElementById("reload").onclick=()=>{const url=window.STORE_CONFIG?.SHEETS_WEB_APP_URL;if(!url||url.includes("PASTE_YOUR")){alert("กรุณาตั้งค่า Apps Script URL ใน config.js");return}const s=document.createElement("script");s.src=url+"?action=list&callback=render&_="+Date.now();s.onerror=()=>alert("โหลดข้อมูลไม่ได้ ตรวจสอบ URL และสิทธิ์การ Deploy");document.body.appendChild(s)};
</script></body></html>
